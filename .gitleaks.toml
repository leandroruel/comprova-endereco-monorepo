# Allowlist de falsos positivos do detector genérico.
#
# Atenção: no gitleaks as condições de um `[allowlist]` são **OR**. Um `paths`
# sozinho libera o arquivo inteiro; por isso a entrada nova abaixo é só um regex
# de linha (nada de `paths` para o teste do worker).
#
# Não desabilita a detecção de segredos no restante do repositório: os dois
# regexes abaixo só casam texto exato de teste que não pode ser um segredo.

[extend]
useDefault = true

# `SECRET_KEY_MULTIBASE` em `data-integrity.test.ts` é a chave privada do VETOR
# DE TESTE NORMATIVO B.3 da W3C (eddsa-jcs-2022), publicada na própria
# especificação:
#   https://www.w3.org/TR/vc-di-eddsa/#b-3-representation-eddsa-jcs-2022
# Não é um segredo: existe apenas para provar interoperabilidade byte a byte.
#
# O regex de `private_key_pem` cobre uma REFERÊNCIA a variável no teste do
# worker (commit f8a421b), não um literal de chave: o detector genérico casa o
# nome do campo com o identificador de alta entropia. O teste já passou a montar
# o JSON pelo helper `signingKeysConfig`, então esse texto só existe no
# histórico do PR e a entrada pode sair após o merge.
# `ECC_NIST_EDWARDS25519` é o KeySpec PÚBLICO de chave Ed25519 do AWS KMS
# (identificador de API, não material secreto). O detector genérico casa
# `KeySpec = ECC_NIST_EDWARDS25519` como "generic-api-key" pela entropia do
# valor; o regex de linha abaixo cobre os únicos pontos que citam o KeySpec.
[allowlist]
description = "vetor de teste público da W3C (eddsa-jcs-2022), referência a variável no teste do worker e KeySpec público do AWS KMS"
paths = ['''packages/credential/src/data-integrity\.test\.ts$''']
regexTarget = "line"
regexes = [
  '''SECRET_KEY_MULTIBASE''',
  '''private_key_pem:\s*signing\.privateKeyPkcs8Pem''',
  '''ECC_NIST_EDWARDS25519''',
]
