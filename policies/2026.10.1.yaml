version: '2026.10.1'
weights:
  document_integrity: 1.0
  registry_status: 1.2
  country_check: 1.0
  cep_consistency: 1.0
  cnefe_match: 1.0
  cotenancy: 1.3
  cnae_vs_location: 0.8
hard_rules:
  - id: foreign-address
    when_checker: country_check
    when_detail_equals:
      verdict_hint: FOREIGN
    verdict: FOREIGN
    confidence: 0.9
  - id: cep-inexistente
    when_checker: cep_consistency
    when_detail_equals:
      reason: cep_not_found
    verdict: NOT_FOUND
    confidence: 0.8
  - id: registry-baixada
    when_checker: registry_status
    when_detail_equals:
      situacao: baixada
    verdict: INCONSISTENT
    confidence: 0.85
required_checkers:
  - document_integrity
  - registry_status
  - country_check
  - cep_consistency
  - cnefe_match
  - cotenancy
decision:
  insufficient_band: [-0.2, 0.2]
  conflict_threshold: 0.45
  confirmed_threshold: 0.35
