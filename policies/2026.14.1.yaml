version: '2026.14.1'
weights:
  document_integrity: 1.0
  registry_status: 1.2
  country_check: 1.0
  cep_consistency: 1.0
  cnefe_match: 1.0
  cotenancy: 1.3
  cnae_vs_location: 0.8
  geocode_consensus: 1.0
  places_match: 1.1
  digital_footprint: 0.5
  street_view_vlm: 1.2
# F3.1: força da evidência fiscal. Aplicada somente quando a observação é
# `supports` (document=authentic + address.matches, com holder≠differs). Força
# deliberadamente conservadora: 0.4 × 0.8 = 0.32, abaixo do
# `confirmed_threshold` (0.35) e do `conflict_threshold` (0.45) — a NF3e sozinha
# não confirma nem cria conflito; ela contribui junto das demais evidências.
# `differs`, `not_extracted`, `inconclusive`, `unavailable` e `unsupported`
# permanecem sem força.
evidence_checkers:
  nf3e_verification:
    strength: 0.4
    confidence: 0.8
hard_rules:
  - id: foreign-address
    when_checker: country_check
    when_detail_equals:
      verdict_hint: FOREIGN
    verdict: FOREIGN
    confidence: 0.9
  - id: registry-baixada
    when_checker: registry_status
    when_detail_equals:
      situacao: baixada
    verdict: INCONSISTENT
    confidence: 0.85
required_checkers:
  - document_integrity
  - registry_status
  - country_check
  - cep_consistency
  - cnefe_match
  - cotenancy
decision:
  insufficient_band: [-0.2, 0.2]
  conflict_threshold: 0.45
  confirmed_threshold: 0.35
