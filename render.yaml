services:
  # --- Redis (serviço gerenciado pelo Render) ---
  - type: redis
    name: comprova-redis
    region: ohio
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # --- Document Intelligence (Tesseract/Marker OCR) ---
  # Deploy separadamente (ex.: container registry privado) e configure a URL.
  # O serviço expõe /ready para health check e /parse para extração de texto.
  - type: web
    name: comprova-document-intelligence
    region: ohio
    plan: free
    runtime: docker
    dockerfilePath: apps/document-intelligence/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: '8000'
      - key: HOST
        value: '0.0.0.0'
    healthCheckPath: /ready
    autoDeploy: false

  # --- API Comprova (Fastify/Node.js) ---
  - type: web
    name: comprova-api
    region: ohio
    plan: free
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: WORKER_LOOPS
        value: 'false'
      - key: PORT
        value: '3000'
      - key: HOST
        value: '0.0.0.0'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_ADMIN_URL
        sync: false
      - key: REFERENCE_DATABASE_URL
        sync: false
      - key: REFERENCE_DATABASE_ADMIN_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: comprova-redis
          property: connectionString
      - key: API_KEY_PEPPER
        sync: false
      - key: INVITE_TOKEN_PEPPER
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        value: https://comprova-api.onrender.com
      - key: DASHBOARD_ADMIN_ORIGINS
        value: https://comprova-dashboard.leandro-ruel.workers.dev
      - key: DASHBOARD_VERIFIER_ORIGINS
        value: https://comprova-verifier-dashboard.leandro-ruel.workers.dev
      - key: CREDENTIAL_ISSUER_ORIGIN
        value: https://comprova-api.onrender.com
      - key: CREDENTIAL_SIGNING_KEYS
        sync: false
      - key: TERMS_VERSION
        value: '1.0.0'
      - key: TERMS_APPROVED
        value: 'true'
      - key: TERMS_DOCUMENT_CONTENT
        sync: false
      - key: TERMS_DOCUMENT_HASH
        sync: false
      # --- Object Store (evidence upload) ---
      # Configure S3 OU Supabase Storage OU LOCAL_STORAGE_PATH.
      # O provider é selecionado automaticamente pela disponibilidade.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: evidence
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: evidence
      - key: LOCAL_STORAGE_PATH
        sync: false
      # --- Document Intelligence (para upload de documentos com OCR) ---
      - key: DOCUMENT_INTELLIGENCE_URL
        fromService:
          type: web
          name: comprova-document-intelligence
          property: hostport
    healthCheckPath: /healthz
    autoDeploy: false

  # --- Worker Comprova (background loops) ---
  - type: worker
    name: comprova-worker
    region: ohio
    plan: free
    runtime: docker
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: WORKER_LOOPS
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_ADMIN_URL
        sync: false
      - key: REFERENCE_DATABASE_URL
        sync: false
      - key: REFERENCE_DATABASE_ADMIN_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: comprova-redis
          property: connectionString
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: evidence
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: evidence
      - key: LOCAL_STORAGE_PATH
        sync: false
      - key: DOCUMENT_INTELLIGENCE_URL
        fromService:
          type: web
          name: comprova-document-intelligence
          property: hostport
      # --- Credential Issuance (deve espelhar a API) ---
      - key: CREDENTIAL_ISSUER_ORIGIN
        value: https://comprova-api.onrender.com
      - key: CREDENTIAL_SIGNING_KEYS
        sync: false
    autoDeploy: false
