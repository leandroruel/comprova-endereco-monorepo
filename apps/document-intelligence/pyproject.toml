[project]
name = "document-intelligence"
version = "0.1.0"
description = "Serviço independente de processamento documental com Marker (OCR + layout, sem LLM)"
requires-python = ">=3.10,<4"
dependencies = [
    "marker-pdf==2.1.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.4,<3",
    "pydantic-settings>=2.4,<3",
    "python-multipart>=0.0.9,<1",
    "filetype>=1.2,<2",
    "psutil>=7.0,<8",
    "python-dotenv>=1.0,<2",
    "structlog>=24.1,<28",
    "beautifulsoup4>=4.12,<5",
    "pypdfium2>=4,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.26,<2",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_intelligence"]

[tool.pytest.ini_options]
markers = [
    "integration: teste de integracao (exige modelos do Marker)",
]
testpaths = ["src/document_intelligence/tests"]
asyncio_mode = "auto"
