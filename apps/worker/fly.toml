# fly.toml — Worker Comprova (loops assíncronos)
# Deploy: flyctl deploy --config apps/worker/fly.toml

app = "comprova-worker"
primary_region = "gru"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  WORKER_LOOPS = "true"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "tsx apps/worker/src/index.ts"

# Secrets (não versionar): definir com `flyctl secrets set --config apps/worker/fly.toml`
#   DATABASE_URL, DATABASE_ADMIN_URL, REFERENCE_DATABASE_URL
#   REDIS_URL
#   S3_ENDPOINT, S3_REGION, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_BUCKET
#   DOCUMENT_INTELLIGENCE_URL
