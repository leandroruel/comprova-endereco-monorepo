# wrangler.toml — Dashboard Comprova (Cloudflare Worker proxy)
# Deploy: npx wrangler deploy --config apps/dashboard/wrangler.toml

name = "comprova-dashboard"
main = "src/worker.ts"
compatibility_date = "2026-11-21"
workers_dev = true

[build]
  command = "pnpm install && pnpm --filter dashboard build"

[assets]
  directory = "dist"
  binding = "ASSETS"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
