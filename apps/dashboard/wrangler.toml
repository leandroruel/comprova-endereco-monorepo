# wrangler.toml — Dashboard Comprova (Cloudflare Pages + Worker proxy)
# Deploy: npx wrangler pages deploy dist --project-name=comprova-dashboard --config apps/dashboard/wrangler.toml

name = "comprova-dashboard"
main = "src/worker.ts"
compatibility_date = "2026-11-21"

[build]
  command = "VITE_API_URL=/api VITE_DASHBOARD_ADMIN_AUTH_URL=/api/auth pnpm install && pnpm --filter dashboard build"
  watch_dir = "apps/dashboard"
  root = "apps/dashboard/dist"

[assets]
  directory = "dist"
  binding = "ASSETS"

[env.production]
  vars = { VITE_API_URL = "/api", VITE_DASHBOARD_ADMIN_AUTH_URL = "/api/auth" }

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
