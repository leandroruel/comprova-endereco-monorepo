# wrangler.toml — Dashboard Comprova (Cloudflare Worker proxy)
# Deploy: npx wrangler deploy --config apps/dashboard/wrangler.toml

name = "comprova-dashboard"
main = "src/worker.ts"
compatibility_date = "2026-11-21"
workers_dev = true

[build]
  command = "pnpm install && pnpm --filter dashboard build"

# Keep-warm da API no Render (plano free): a instância desliga após 15 min de
# inatividade; um ping a cada 5 min em /healthz (handler `scheduled` em
# src/worker.ts) evita o cold start de ~1 min no primeiro acesso.
[triggers]
crons = ["*/5 * * * *"]

[vars]
API_BASE = "https://comprova-api.onrender.com"
DASHBOARD_ORIGIN = "https://comprova-dashboard.leandro-ruel.workers.dev"

[assets]
  directory = "dist"
  binding = "ASSETS"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
