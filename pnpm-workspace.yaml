packages:
  - apps/*
  - packages/*
# Build scripts aprovados por nome. Antes ficava em `package.json#pnpm
# .onlyBuiltDependencies`; o pnpm 11+ só lê isso daqui, e o `strictDepBuilds`
# (ligado por padrão) falha o install se algum build não estiver decidido.
allowBuilds:
  esbuild: true
  # Transitivos que o pnpm 10 já ignorava (nunca rodaram aqui): `@swc/core` vem
  # de @temporalio/worker, `protobufjs` de @temporalio/client e `ssh2`/
  # `cpu-features` do testcontainers (só testes). Negar explicitamente é a
  # decisão revisada — e o registro de que não queremos esses builds.
  '@swc/core': false
  protobufjs: false
  ssh2: false
  cpu-features: false
# O vitest declara `jsdom` como peer opcional, e o `autoInstallPeers` o
# resolvia mesmo sem ninguém usá-lo: os testes de componente rodam no Chromium
# (Browser Mode) e o jsdom saiu das dependências no mesmo PR. A aresta removida
# tira o jsdom e sua árvore do lockfile. Se um dia voltar a existir teste com
# `environment: 'jsdom'`, é esta linha que precisa sair.
# O client-kms 3.1151.0 (mesma linha do client-s3) resolve transitivos do
# AWS SDK publicados dentro da janela de quarentena do pnpm 12. Fixados no
# lockfile e isentos explicitamente até envelhecerem; o client-kms em si
# (3.1151.0) é anterior à janela.
minimumReleaseAgeExclude:
  - '@aws-sdk/core@3.978.5'
  - '@aws-sdk/credential-provider-env@3.972.76'
  - '@aws-sdk/credential-provider-http@3.972.78'
  - '@aws-sdk/credential-provider-ini@3.973.21'
  - '@aws-sdk/credential-provider-login@3.972.83'
  - '@aws-sdk/credential-provider-node@3.972.88'
  - '@aws-sdk/credential-provider-process@3.972.76'
  - '@aws-sdk/credential-provider-sso@3.973.20'
  - '@aws-sdk/credential-provider-web-identity@3.972.82'
  - '@aws-sdk/nested-clients@3.997.50'
  - '@aws-sdk/signature-v4-multi-region@3.996.49'
  - '@aws-sdk/token-providers@3.1155.0'
  - '@aws-sdk/types@3.975.0'
  - '@smithy/core@3.36.1'
overrides:
  'vitest>jsdom': '-'
permissions:
  '@tanstack/react-table':
    skills: false
