apiVersion: apps/v1
kind: Deployment
metadata:
  name: comprova-worker
spec:
  replicas: 2
  selector:
    matchLabels: { app: comprova-worker }
  template:
    metadata:
      labels: { app: comprova-worker }
    spec:
      # workers T2 toleram spot (spec secao 11)
      tolerations:
        - { key: spot, operator: Exists, effect: NoSchedule }
      containers:
        - name: worker
          image: ghcr.io/leandroruel/comprova-worker:latest
          envFrom:
            - secretRef: { name: comprova-worker-secrets }
          env:
            - { name: WORKER_LOOPS, value: 'true' }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
