name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Nenhum step faz git push: não persistir o GITHUB_TOKEN no .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # v6 é a linha que instala o pnpm 12 (o v4 não sabe provisioná-lo); a
      # versão vem do `packageManager` do package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium para o projeto `dashboard` do Vitest Browser Mode: o download
      # dos navegadores não acontece no `pnpm install`.
      - run: npx playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm db:fence
      - run: pnpm test

  marker-real:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ci]
    steps:
      # O teste de integração com Marker precisa do serviço Document Intelligence
      # em execução (porta 8000). O PostgreSQL/Redis são provisionados pelo
      # testcontainers dentro do próprio teste.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Inicia apenas o serviço Document Intelligence (perfil dedicado).
      - run: docker compose --profile document-intelligence up -d document-intelligence
      # Aguarda o Document Intelligence ficar pronto (health check /ready).
      - run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/ready > /dev/null 2>&1; then
              echo "Document Intelligence está pronto"
              exit 0
            fi
            echo "Aguardando Document Intelligence... ($i/60)"
            sleep 5
          done
          echo "Document Intelligence não ficou pronto a tempo" >&2
          exit 1
      # Executa apenas o teste de integração real com o Marker.
      - run: pnpm vitest run --project marker-real
        env:
          DOCUMENT_INTELLIGENCE_URL: http://localhost:8000

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # O gitleaks calcula o range do PR (HEAD^..HEAD). Com o clone raso
      # padrão (fetch-depth: 1) o commit pai não existe e o scan aborta sem
      # escanear nada.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # O `curl | sh` do Trivy roda no mesmo workspace; sem persistência, ele
          # não encontra o GITHUB_TOKEN no repositório.
          persist-credentials: false
      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit dependencies
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --scanners vuln,secret --exit-code 1 --ignorefile .trivyignore.yaml .
