name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Nenhum step faz git push: não persistir o GITHUB_TOKEN no .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # v6 é a linha que instala o pnpm 12 (o v4 não sabe provisioná-lo); a
      # versão vem do `packageManager` do package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium para o projeto `dashboard` do Vitest Browser Mode: o download
      # dos navegadores não acontece no `pnpm install`.
      - run: npx playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm db:fence
      - run: pnpm test

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # O gitleaks calcula o range do PR (HEAD^..HEAD). Com o clone raso
      # padrão (fetch-depth: 1) o commit pai não existe e o scan aborta sem
      # escanear nada.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # O `curl | sh` do Trivy roda no mesmo workspace; sem persistência, ele
          # não encontra o GITHUB_TOKEN no repositório.
          persist-credentials: false
      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit dependencies
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --scanners vuln,secret --exit-code 1 --ignorefile .trivyignore.yaml .
