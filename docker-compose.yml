# Serviços com `comprova_logs=true` são coletados pelo Filebeat quando o
# perfil `elk` está ativo (docker-compose.elk.yml). Os serviços do Elastic
# Stack não recebem esse label para não coletarem os próprios logs.
services:
  postgres:
    image: postgis/postgis:16-3.4
    labels:
      comprova_logs: 'true'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comprova
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d comprova']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    labels:
      comprova_logs: 'true'
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/admin-tools:1.27.0
    labels:
      comprova_logs: 'true'
    entrypoint: ['temporal', 'server', 'start-dev', '--ip', '0.0.0.0', '--port', '7233', '--ui-port', '8233']
    ports:
      - '7233:7233'
      - '8233:8233'

  objectstorage:
    image: zenko/cloudserver:latest
    labels:
      comprova_logs: 'true'
    environment:
      S3DATA: multiple
      S3_BACKEND: mem
      REMOTE_MANAGEMENT_DISABLE: 'true'
    ports:
      - '9000:8000'
    volumes:
      - ./compose/cloudserver-config.json:/usr/src/app/config.json:ro
      - objectdata:/data

  objectstorage-init:
    image: amazon/aws-cli:latest
    depends_on:
      - objectstorage
    environment:
      AWS_ACCESS_KEY_ID: accessKey1
      AWS_SECRET_ACCESS_KEY: verySecretKey1
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: |
      /bin/sh -c "
      i=0
      while [ $$i -lt 30 ]; do
        aws --endpoint-url http://objectstorage:8000 s3 mb s3://evidence && exit 0
        sleep 2
        i=$$((i+1))
      done
      exit 1
      "

  # Serviço independente de OCR/layout (Python + Marker). Processa PDFs e
  # devolve JSON estruturado; não guarda documentos e não usa LLM.
  # Opt-in: `docker compose --profile document-intelligence up -d` — o stack
  # padrão não constrói nem inicia esta imagem (build pesado, warmup longo).
  document-intelligence:
    build:
      context: ./apps/document-intelligence
      dockerfile: Dockerfile
    profiles:
      - document-intelligence
    labels:
      comprova_logs: 'true'
    environment:
      DI_PORT: '8000'
      DI_MAX_FILE_SIZE_MB: '30'
      DI_MAX_CONCURRENCY: '1'
      # Capacidade total de admissão = 1 + 2; excedente recebe 429 sem ter o
      # upload lido (evita acumular PDFs em memória).
      DI_MAX_QUEUE: '2'
      DI_TIMEOUT_S: '300'
      # Limite de páginas aplicado na inspeção prévia (antes da inferência).
      DI_MAX_PAGES: '100'
      # Recortes de imagem (Picture/Figure/Diagram) embutidos como data URL,
      # com tetos por imagem (256 KiB) e por documento (2 MiB).
      DI_INCLUDE_IMAGES: 'true'
      DI_PRELOAD_MODELS: 'true'
      DI_WARMUP: 'true'
      DI_LOG_LEVEL: 'info'
    ports:
      # Só a máquina local acessa o serviço sem autenticação. Em produção,
      # mantenha-o em rede privada atrás da API.
      - '127.0.0.1:8000:8000'
    volumes:
      # Pesos do Marker/Surya (persistem entre reinícios; o primeiro boot baixa).
      - document_intelligence_cache:/app/.cache
      - document_intelligence_tmp:/tmp/document-intelligence
    # Healthcheck = READINESS (/ready): 200 só com modelos carregados, warmup
    # concluído e memória suficiente; 503 enquanto não estiver pronto. O
    # Dockerfile mantém HEALTHCHECK de liveness em /health. Como o Compose
    # aceita um único healthcheck por serviço, o de liveness fica no Dockerfile.
    # `start_period` largo cobre o primeiro warmup em CPU (~5 min).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 15m

volumes:
  pgdata:
  objectdata:
  document_intelligence_cache:
  document_intelligence_tmp:
